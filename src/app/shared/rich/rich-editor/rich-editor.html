<div class="rt-toolbar" role="toolbar" [attr.aria-label]="'editor.toolbar' | t">
  @for (group of groups; track $index) {
    @if ($index) { <span class="sep"></span> }
    @for (b of group; track b.title) {
      <button type="button" [class.on]="tick() >= 0 && editor && b.active?.(editor)" [title]="b.title | t"
        [attr.aria-label]="b.title | t" [attr.style]="b.style ?? null" (mousedown)="$event.preventDefault()" (click)="editor && b.run(editor)">{{ b.label }}</button>
    }
  }
  @if (tick() >= 0 && editor?.isActive('table')) {
    <span class="sep"></span>
    @for (b of tableButtons; track b.title) {
      <button type="button" [title]="b.title | t" (mousedown)="$event.preventDefault()" (click)="editor && b.run(editor)">{{ b.label }}</button>
    }
  }
  @if (uploader()) {
    <span class="sep"></span>
    <button type="button" [title]="'editor.image' | t" (click)="file.click()">🖼</button>
    <input #file type="file" accept="image/*" hidden (change)="insertImages(file)" />
  }
</div>
<div #host></div>
